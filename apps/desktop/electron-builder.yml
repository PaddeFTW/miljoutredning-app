appId: se.kvalitetsgruppen.miljoutredning.desktop
productName: Miljöutredning – KvalitetsGruppen
electronVersion: 39.8.10
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../../node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName} Setup ${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
